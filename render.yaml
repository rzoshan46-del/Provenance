# Render deployment configuration (100% FREE Tier)
# https://render.com — connect your GitHub repo, click "New Web Service"
services:
  - type: web
    name: critx-provenance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: google
      - key: PROVENANCE_DEMO
        value: "0"
      - key: PROVENANCE_LLM
        value: off
      - key: PROVENANCE_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PROVENANCE_DB
        value: /var/data/app.db
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    disk:
      name: provenance-data
      mountPath: /var/data
      sizeGB: 1
