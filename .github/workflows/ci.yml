name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python smoke.py
        env:
          PROVENANCE_DEMO: '1'
          AUTH_MODE: demo
          APP_ENV: development
          PROVENANCE_LLM: canned
      - run: python smoke_certificates.py
        env:
          PROVENANCE_DEMO: '1'
          AUTH_MODE: demo
          APP_ENV: development
          PROVENANCE_LLM: canned
